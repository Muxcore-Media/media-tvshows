name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
      - run: go build -o media-tvshows ./cmd/module
      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: media-tvshows
