name: CI
on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          path: core
          repository: Muxcore-Media/core
          token: ${{ secrets.MUXCORE_CI_TOKEN }}
      - uses: actions/checkout@v7
        with:
          path: contracts-media-admin
          repository: Muxcore-Media/contracts-media-admin
          token: ${{ secrets.MUXCORE_CI_TOKEN }}
      - uses: actions/checkout@v7
        with:
          path: media-root-folders
          repository: Muxcore-Media/media-root-folders
          token: ${{ secrets.MUXCORE_CI_TOKEN }}
      - uses: actions/checkout@v7
        with:
          path: metadata-tmdb
          repository: Muxcore-Media/metadata-tmdb
          token: ${{ secrets.MUXCORE_CI_TOKEN }}
      - uses: actions/checkout@v7
        with:
          path: media-tvshows
      - uses: actions/setup-go@v6
        with:
          go-version: "1.26"
          cache: true
      - uses: golangci/golangci-lint-action@v9
        with:
          version: latest
          working-directory: ./media-tvshows
          args: --timeout 120s

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          path: core
          repository: Muxcore-Media/core
          token: ${{ secrets.MUXCORE_CI_TOKEN }}
      - uses: actions/checkout@v7
        with:
          path: contracts-media-admin
          repository: Muxcore-Media/contracts-media-admin
          token: ${{ secrets.MUXCORE_CI_TOKEN }}
      - uses: actions/checkout@v7
        with:
          path: media-root-folders
          repository: Muxcore-Media/media-root-folders
          token: ${{ secrets.MUXCORE_CI_TOKEN }}
      - uses: actions/checkout@v7
        with:
          path: metadata-tmdb
          repository: Muxcore-Media/metadata-tmdb
          token: ${{ secrets.MUXCORE_CI_TOKEN }}
      - uses: actions/checkout@v7
        with:
          path: media-tvshows
      - uses: actions/setup-go@v6
        with:
          go-version: "1.26"
          cache: true
      - working-directory: ./media-tvshows
        run: go test -race -count=1 -timeout 60s ./...

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          path: core
          repository: Muxcore-Media/core
          token: ${{ secrets.MUXCORE_CI_TOKEN }}
      - uses: actions/checkout@v7
        with:
          path: contracts-media-admin
          repository: Muxcore-Media/contracts-media-admin
          token: ${{ secrets.MUXCORE_CI_TOKEN }}
      - uses: actions/checkout@v7
        with:
          path: media-root-folders
          repository: Muxcore-Media/media-root-folders
          token: ${{ secrets.MUXCORE_CI_TOKEN }}
      - uses: actions/checkout@v7
        with:
          path: metadata-tmdb
          repository: Muxcore-Media/metadata-tmdb
          token: ${{ secrets.MUXCORE_CI_TOKEN }}
      - uses: actions/checkout@v7
        with:
          path: media-tvshows
      - uses: actions/setup-go@v6
        with:
          go-version: "1.26"
          cache: true
      - working-directory: ./media-tvshows
        run: |
          go build -o /dev/null ./cmd/module
          go vet ./...

  docker:
    if: (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    needs: [lint, test, build]
    steps:
      - uses: actions/checkout@v7
        with:
          path: core
          repository: Muxcore-Media/core
          token: ${{ secrets.MUXCORE_CI_TOKEN }}
      - uses: actions/checkout@v7
        with:
          path: contracts-media-admin
          repository: Muxcore-Media/contracts-media-admin
          token: ${{ secrets.MUXCORE_CI_TOKEN }}
      - uses: actions/checkout@v7
        with:
          path: media-root-folders
          repository: Muxcore-Media/media-root-folders
          token: ${{ secrets.MUXCORE_CI_TOKEN }}
      - uses: actions/checkout@v7
        with:
          path: metadata-tmdb
          repository: Muxcore-Media/metadata-tmdb
          token: ${{ secrets.MUXCORE_CI_TOKEN }}
      - uses: actions/checkout@v7
        with:
          path: media-tvshows
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: ./media-tvshows/Dockerfile
          push: true
          tags: ${{ env.REGISTRY }}/${{ github.repository }}:${{ github.sha }}
