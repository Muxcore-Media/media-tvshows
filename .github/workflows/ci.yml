name: CI
on:
  push: { branches: [master, main] }
  pull_request: { branches: [master, main] }
env:
  REGISTRY: ghcr.io
  GOPRIVATE: github.com/Muxcore-Media/*
jobs:
  lint:
    runs-on: self-hosted
    steps:
      - uses: Muxcore-Media/mvp/.github/actions/checkout-mirror@main
        with:
          token: ${{ secrets.MUXCORE_CI_TOKEN || github.token }}
      - uses: actions/setup-go@v7
        with: { go-version: "1.26", cache: false }
      - name: Configure private modules (HTTPS)
        run: git config --global url."https://x-access-token:${{ secrets.MUXCORE_CI_TOKEN || github.token }}@github.com/".insteadOf "https://github.com/"
      - run: go vet ./...
  test:
    runs-on: self-hosted
    steps:
      - uses: Muxcore-Media/mvp/.github/actions/checkout-mirror@main
        with:
          token: ${{ secrets.MUXCORE_CI_TOKEN || github.token }}
      - uses: actions/setup-go@v7
        with: { go-version: "1.26", cache: false }
      - name: Configure private modules (HTTPS)
        run: git config --global url."https://x-access-token:${{ secrets.MUXCORE_CI_TOKEN || github.token }}@github.com/".insteadOf "https://github.com/"
      - run: go test -count=1 -timeout 10m ./...
  build:
    runs-on: self-hosted
    steps:
      - uses: Muxcore-Media/mvp/.github/actions/checkout-mirror@main
        with:
          token: ${{ secrets.MUXCORE_CI_TOKEN || github.token }}
      - uses: actions/setup-go@v7
        with: { go-version: "1.26", cache: false }
      - name: Configure private modules (HTTPS)
        run: git config --global url."https://x-access-token:${{ secrets.MUXCORE_CI_TOKEN || github.token }}@github.com/".insteadOf "https://github.com/"
      - run: |
          go build -o /dev/null ./cmd/module
          go vet ./...
  docker:
    if: (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main')
    runs-on: self-hosted
    needs: [lint, test, build]
    steps:
      - uses: Muxcore-Media/mvp/.github/actions/checkout-mirror@main
        with:
          token: ${{ secrets.MUXCORE_CI_TOKEN || github.token }}
      - name: Checkout dependencies
        env:
          TOKEN: ${{ secrets.MUXCORE_CI_TOKEN || github.token }}
        run: |
          git clone --depth 1 "https://x-access-token:${TOKEN}@github.com/Muxcore-Media/core.git" core
          git clone --depth 1 "https://x-access-token:${TOKEN}@github.com/Muxcore-Media/contracts-media-admin.git" contracts-media-admin
      - name: Prepare workspace layout for Docker
        run: |
          mkdir -p media-tvshows
          shopt -s dotglob
          for item in *; do
            case "$item" in core|contracts-media-admin|media-tvshows) continue ;; esac
            mv "$item" media-tvshows/
          done
      - name: Configure private modules (HTTPS)
        run: git config --global url."https://x-access-token:${{ secrets.MUXCORE_CI_TOKEN || github.token }}@github.com/".insteadOf "https://github.com/"
      - uses: docker/setup-buildx-action@v4
      - name: Lowercase image name
        run: echo "IMAGE_NAME=${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"
      - uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: ./media-tvshows/Dockerfile
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
