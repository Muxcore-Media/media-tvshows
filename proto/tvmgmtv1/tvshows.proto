syntax = "proto3";
package muxcore.media.tv.v1;
option go_package = "github.com/Muxcore-Media/media-tvshows/proto/tvmgmtv1;tvmgmtv1";

service TvManagementService {
  rpc AddTVShow(AddTVShowRequest) returns (AddTVShowResponse);
  rpc RemoveTVShow(RemoveTVShowRequest) returns (RemoveTVShowResponse);
  rpc RefreshMetadata(RefreshMetadataRequest) returns (RefreshMetadataResponse);
  rpc ListTVShows(ListTVShowsRequest) returns (ListTVShowsResponse);
  rpc ListMissing(ListMissingRequest) returns (ListMissingResponse);
  rpc GetTVShow(GetTVShowRequest) returns (GetTVShowResponse);
  rpc UpdateTVShow(UpdateTVShowRequest) returns (UpdateTVShowResponse);
  rpc UpdateEpisodeMonitored(UpdateEpisodeMonitoredRequest) returns (UpdateEpisodeMonitoredResponse);
  rpc UpdateSeasonMonitored(UpdateSeasonMonitoredRequest) returns (UpdateSeasonMonitoredResponse);
  rpc AddEpisodeFile(AddEpisodeFileRequest) returns (AddEpisodeFileResponse);
  rpc RemoveEpisodeFile(RemoveEpisodeFileRequest) returns (RemoveEpisodeFileResponse);
  rpc CreateTag(CreateTagRequest) returns (CreateTagResponse);
  rpc DeleteTag(DeleteTagRequest) returns (DeleteTagResponse);
  rpc ListTags(ListTagsRequest) returns (ListTagsResponse);
  rpc SetItemTags(SetItemTagsRequest) returns (SetItemTagsResponse);
  rpc GetItemTags(GetItemTagsRequest) returns (GetItemTagsResponse);
  rpc GetCalendar(GetCalendarRequest) returns (GetCalendarResponse);
  rpc ListAlternateTitles(ListAlternateTitlesRequest) returns (ListAlternateTitlesResponse);
  rpc AddAlternateTitle(AddAlternateTitleRequest) returns (AddAlternateTitleResponse);
  rpc RemoveAlternateTitle(RemoveAlternateTitleRequest) returns (RemoveAlternateTitleResponse);
  rpc LookupEpisode(LookupEpisodeRequest) returns (LookupEpisodeResponse);
  // SetContentRating records, replaces or clears the operator's parental
  // classification of a series (ADR-0031 Decision 2). Seasons and episodes
  // inherit it. No caller authorization is checked in this module: like
  // SetItemTags, the consumer BFF restricts the call to admins.
  rpc SetContentRating(SetContentRatingRequest) returns (SetContentRatingResponse);
  // GetEpisode returns one episode, including the series_id of its owning
  // series, so a caller holding only an episode id (for example
  // /stream/tv/<episode_id>) can classify it by its series (ADR-0031
  // Decision 2.4). Unknown ids, and episodes without an owning series, return
  // NotFound.
  rpc GetEpisode(GetEpisodeRequest) returns (GetEpisodeResponse);
}

message AddTVShowRequest {
  int32 tmdb_id = 1;
  string name = 2;
  int32 year = 3;
  string overview = 4;
  string poster_path = 5;
  string backdrop_path = 6;
  repeated string genres = 7;
  string quality_profile_id = 8;
  string root_folder_path = 9;
  string series_type = 10; // "standard", "daily", or "anime"
  // Field 11 was used for an unauthenticated content_rating by the unmerged
  // v0.1.21 tag (never on master). It is reserved so it is never reused.
  reserved 11;
}

message AddTVShowResponse {
  string series_id = 1;
}

message RemoveTVShowRequest {
  string series_id = 1;
  bool delete_files = 2;
}

message RemoveTVShowResponse {}

message RefreshMetadataRequest {
  string series_id = 1;
}

message RefreshMetadataResponse {}

message ListTVShowsRequest {
  int32 page = 1;
  int32 page_size = 2;
  string search = 3;
  string genre = 4;
  string sort_by = 5;
  string sort_order = 6;
  string tag_id = 7;
  // Optional parental narrowing (ADR-0031 Decision 2.1). It can only hide
  // series: unset or enabled=false leaves the result unchanged. When enabled,
  // total and pagination count only the visible series.
  ClassificationFilter classification_filter = 8;
}

// ClassificationFilter hides series a restricted principal may not see. It is
// evaluated per ADR-0031 Decision 2.6: a series with no recorded rating
// (unavailable) is always hidden, an explicit NR is visible only when
// allow_unrated is set, a rated series must not exceed max_rating, a blocked
// tag hides the series, and a non-empty allowed_tags requires one match that
// never overrides a rating denial. Tags compare by exact case-folded match.
// Unknown tokens or empty tags are rejected with InvalidArgument.
message ClassificationFilter {
  bool enabled = 1;
  // Rating ceiling token on the ADR-0031 ladder (for example "PG-13"). Empty
  // means no ceiling. The BFF resolves kids_mode to "PG" before calling.
  string max_rating = 2;
  bool allow_unrated = 3;
  repeated string blocked_tags = 4;
  repeated string allowed_tags = 5;
}

message ListTVShowsResponse {
  repeated TVSeries series = 1;
  int32 total = 2;
  int32 page = 3;
  int32 page_size = 4;
}

message ListMissingRequest {
  int32 page = 1;
  int32 page_size = 2;
  string series_id = 3;
}

message ListMissingResponse {
  repeated MissingEpisodeItem items = 1;
  int32 total = 2;
  int32 page = 3;
  int32 page_size = 4;
}

message MissingEpisodeItem {
  string episode_id = 1;
  string series_id = 2;
  int32 tmdb_id = 3;
  string title = 4;
  int32 year = 5;
  int32 season_number = 6;
  int32 episode_number = 7;
  string quality_profile_id = 8;
  string air_date = 9;
  int32 absolute_number = 10;
  string series_type = 11; // "standard", "daily", or "anime"
}

message GetTVShowRequest {
  string series_id = 1;
}

message GetTVShowResponse {
  TVSeries series = 1;
}

message GetEpisodeRequest {
  string episode_id = 1;
}

message GetEpisodeResponse {
  TVEpisode episode = 1;
}

message SetContentRatingRequest {
  string series_id = 1;
  // A rating token on the ADR-0031 ladder, for example "TV-14" or "PG-13"
  // (case-insensitive). Empty together with explicit_unrated=false clears the
  // operator value, returning the series to "unavailable". Unknown tokens are
  // rejected with InvalidArgument. "NR" is not accepted here: use
  // explicit_unrated.
  string content_rating = 2;
  // Records an explicit NR; content_rating must then be empty.
  bool explicit_unrated = 3;
}

message SetContentRatingResponse {}

message UpdateEpisodeMonitoredRequest {
  string episode_id = 1;
  bool monitored = 2;
}

message UpdateEpisodeMonitoredResponse {}

message UpdateSeasonMonitoredRequest {
  string season_id = 1;
  bool monitored = 2;
}

message UpdateSeasonMonitoredResponse {}

message UpdateTVShowRequest {
  string series_id = 1;
  optional string quality_profile_id = 2;
  optional string root_folder_path = 3;
  optional bool monitored = 4;
  optional string series_type = 5; // "standard", "daily", or "anime"
}

message UpdateTVShowResponse {
  TVSeries series = 1;
}

message TVSeries {
  string id = 1;
  int32 tmdb_id = 2;
  string name = 3;
  string original_name = 4;
  int32 year = 5;
  string overview = 6;
  string tagline = 7;
  string status = 8;
  string network = 9;
  string first_air_date = 10;
  string last_air_date = 11;
  double vote_average = 12;
  repeated string genres = 13;
  string poster_path = 14;
  string backdrop_path = 15;
  string poster_url = 16;
  string backdrop_url = 17;
  bool monitored = 18;
  repeated TVSeason seasons = 19;
  int32 total_episodes = 20;
  int32 total_seasons = 21;
  string created_at = 22;
  string updated_at = 23;
  string quality_profile_id = 24;
  string root_folder_path = 25;
  string series_type = 26; // "standard", "daily", or "anime"
  // Field 27 was used for an unauthenticated content_rating by the unmerged
  // v0.1.21 tag (never on master). It is reserved and never read, so that
  // value cannot be mistaken for a classification.
  reserved 27;
  // Parental classification (ADR-0031 Decision 2). The series is the
  // authority; its seasons and episodes carry no classification of their own
  // and inherit this one. content_rating is a ladder token, or "NR" for an
  // explicit unrated record. Empty rating with empty source means
  // "unavailable" (nothing recorded, the state of every pre-existing series),
  // never "unrated". A rating is never inferred: vote_average is not a rating.
  string content_rating = 28;
  // "operator" | "" ("tmdb" is reserved for a later slice).
  string content_rating_source = 29;
  // Labels of the series' operator tags, sorted, so list routes need no N+1.
  repeated string tag_labels = 30;
}

message TVSeason {
  string id = 1;
  string series_id = 2;
  int32 season_number = 3;
  string name = 4;
  string overview = 5;
  int32 episode_count = 6;
  string air_date = 7;
  string poster_path = 8;
  bool monitored = 9;
  repeated TVEpisode episodes = 10;
  string created_at = 11;
  string updated_at = 12;
}

message TVEpisode {
  string id = 1;
  string series_id = 2;
  string season_id = 3;
  int32 tmdb_id = 4;
  int32 episode_number = 5;
  int32 season_number = 6;
  int32 absolute_number = 7;
  string name = 8;
  string overview = 9;
  string air_date = 10;
  string still_path = 11;
  bool monitored = 12;
  bool has_file = 13;
  string created_at = 14;
  string updated_at = 15;
}

message AddEpisodeFileRequest {
  string episode_id = 1;
  string file_path = 2;
  string quality = 3;
  int64 size_bytes = 4;
  string container = 5;
  repeated string episode_ids = 6; // multi-ep: when set, links file to all (episode_id optional)
}

message AddEpisodeFileResponse {
  string file_id = 1;
}

message RemoveEpisodeFileRequest {
  string file_id = 1;
  bool delete_files = 2;
  string episode_id = 3; // when file_id empty, remove the primary file for this episode
}

message RemoveEpisodeFileResponse {}

message CreateTagRequest {
  string label = 1;
}

message CreateTagResponse {
  string tag_id = 1;
}

message DeleteTagRequest {
  string tag_id = 1;
}

message DeleteTagResponse {}

message ListTagsRequest {}

message ListTagsResponse {
  repeated Tag tags = 1;
}

message Tag {
  string id = 1;
  string label = 2;
  string created_at = 3;
}

message SetItemTagsRequest {
  string item_id = 1;
  repeated string tag_ids = 2;
}

message SetItemTagsResponse {}

message GetItemTagsRequest {
  string item_id = 1;
}

message GetItemTagsResponse {
  repeated Tag tags = 1;
}

message GetCalendarRequest {
  string start_date = 1; // YYYY-MM-DD
  string end_date = 2;   // YYYY-MM-DD
  bool include_unmonitored = 3;
}

message GetCalendarResponse {
  repeated CalendarItem items = 1;
}

message CalendarItem {
  string episode_id = 1;
  string series_id = 2;
  string series_name = 3;
  int32 tmdb_id = 4;
  int32 season_number = 5;
  int32 episode_number = 6;
  string episode_name = 7;
  string air_date = 8;
  bool monitored = 9;
  bool has_file = 10;
}

message LookupEpisodeRequest {
  int32 tmdb_id = 1;
  string title = 2;
  int32 year = 3;
  int32 season_number = 4;
  int32 episode_number = 5;
  repeated int32 episode_numbers = 6;
  int32 absolute_number = 7;
  string air_date = 8; // YYYY-MM-DD for daily
}

message LookupEpisodeResponse {
  string series_id = 1;
  string series_name = 2;
  string original_name = 3;
  string episode_title = 4; // multi: "A + B"
  string air_date = 5;
  int32 season_number = 6;
  int32 episode_number = 7;
  int32 absolute_number = 8;
  bool found = 9;
}

message ListAlternateTitlesRequest {
  string series_id = 1;
}

message AlternateTitle {
  string id = 1;
  string title = 2;
  string clean_title = 3;
  string source = 4;
}

message ListAlternateTitlesResponse {
  repeated AlternateTitle titles = 1;
}

message AddAlternateTitleRequest {
  string series_id = 1;
  string title = 2;
}

message AddAlternateTitleResponse {
  AlternateTitle title = 1;
}

message RemoveAlternateTitleRequest {
  string series_id = 1;
  string title_id = 2;
}

message RemoveAlternateTitleResponse {}

